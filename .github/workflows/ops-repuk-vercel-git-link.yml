# Ops: ensure policestationrepuk-new production tracks origin (robertcashman-bit),
# not the read-only droid mirror. Auto-deploys from droid overwrite lead-magnet
# removals and other bit-only fixes.
name: Ops — RepUK Vercel git link (bit)

on:
  workflow_dispatch:

jobs:
  link-and-verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: robert-cashmans-projects
      # robertcashman-bit/Policestationrepuk
      BIT_REPO_ID: '1185472756'
      BIT_ORG: robertcashman-bit
      BIT_REPO: Policestationrepuk
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@41.4.0

      - name: Require secrets
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID missing"
            exit 1
          fi

      - name: Show current project git link
        id: before
        run: |
          proj=$(curl -sS \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          echo "$proj" | jq '{name, id, link: .link, productionBranch}'
          echo "repo=$(echo "$proj" | jq -r '.link.repo // .link.repoName // empty')" >> "$GITHUB_OUTPUT"
          echo "org=$(echo "$proj" | jq -r '.link.org // .link.repoOwner // empty')" >> "$GITHUB_OUTPUT"

      - name: Unlink existing Git connection
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" -X DELETE \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/link?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" || true

      - name: Link robertcashman-bit/Policestationrepuk
        id: link
        run: |
          linked=false
          for body in \
            "{\"type\":\"github\",\"org\":\"${BIT_ORG}\",\"repo\":\"${BIT_REPO}\"}" \
            "{\"type\":\"github\",\"repo\":\"${BIT_ORG}/${BIT_REPO}\"}" \
            "{\"type\":\"github\",\"repoId\":${BIT_REPO_ID}}"; do
            echo "Trying link body: $body"
            resp=$(curl -sS -w "\nHTTP %{http_code}\n" -X POST \
              "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/link?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$body")
            echo "$resp"
            if echo "$resp" | tail -1 | grep -qE 'HTTP (200|201)'; then
              linked=true
              break
            fi
          done
          if [ "$linked" != "true" ]; then
            echo "Git link failed — grant the Vercel GitHub app access to ${BIT_ORG}/${BIT_REPO}"
            exit 1
          fi
          echo "linked=true" >> "$GITHUB_OUTPUT"

      - name: Set production branch to master
        run: |
          curl -sS -X PATCH \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"productionBranch":"master"}' | jq '{name, productionBranch, link}'

      - name: Promote current bit master to production
        id: deploy
        run: |
          set -euo pipefail
          SHA=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${BIT_ORG}/${BIT_REPO}/commits/master" \
            | jq -r '.sha')
          echo "Target SHA: $SHA"

          API="https://api.vercel.com"
          AUTH="Authorization: Bearer ${VERCEL_TOKEN}"

          URL=$(curl -sS "${API}/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=25" \
            -H "${AUTH}" \
            | jq -r --arg sha "$SHA" '.deployments[] | select(.meta.githubCommitSha == $sha) | .url' \
            | head -1)

          if [ -z "$URL" ]; then
            echo "No existing deployment for ${SHA}; triggering git production build"
            RESP=$(curl -sS -X POST "${API}/v13/deployments?teamId=${VERCEL_ORG_ID}" \
              -H "${AUTH}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"policestationrepuk-new\",\"project\":\"${VERCEL_PROJECT_ID}\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"repoId\":${BIT_REPO_ID},\"ref\":\"master\",\"sha\":\"${SHA}\"}}")
            echo "$RESP" | jq '{id, url, readyState}'
            URL=$(echo "$RESP" | jq -r '.url // empty')
          fi

          if [ -z "$URL" ]; then
            echo "Failed to locate/trigger deployment"
            exit 1
          fi

          DEPLOY_URL="https://${URL#https://}"
          HOST="${DEPLOY_URL#https://}"
          for i in $(seq 1 60); do
            STATE=$(curl -sS "${API}/v13/deployments/${HOST}?teamId=${VERCEL_ORG_ID}" \
              -H "${AUTH}" | jq -r '.readyState // "UNKNOWN"')
            echo "[$i/60] state=${STATE}"
            if [ "$STATE" = "READY" ]; then
              set +e
              promo_out=$(vercel promote "$DEPLOY_URL" --yes --scope="$VERCEL_SCOPE" --timeout=15m --token="$VERCEL_TOKEN" 2>&1)
              promo_code=$?
              set -e
              echo "$promo_out"
              # 409 = already current production (treat as success)
              if [ "$promo_code" -ne 0 ] && ! echo "$promo_out" | grep -qi 'already the current production'; then
                exit "$promo_code"
              fi
              echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
              echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "Deployment failed: ${STATE}"
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for READY"
          exit 1

      - name: Verify production health + git link
        run: |
          set -euo pipefail
          WANT="${{ steps.deploy.outputs.short }}"
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" "https://policestationrepuk.org/api/health" || echo "000")
            VER=$(jq -r '.version // empty' /tmp/health.json 2>/dev/null || true)
            echo "[$i/30] health HTTP ${CODE} version=${VER} want=${WANT}"
            if [ "$CODE" = "200" ] && [ "$VER" = "$WANT" ]; then
              break
            fi
            sleep 10
          done

          proj=$(curl -sS \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          echo "$proj" | jq '{name, productionBranch, link: .link}'
          ORG=$(echo "$proj" | jq -r '.link.org // .link.repoOwner // empty')
          REPO=$(echo "$proj" | jq -r '.link.repo // .link.repoName // empty')
          if [ "$ORG" != "${BIT_ORG}" ] || [ "$REPO" != "${BIT_REPO}" ]; then
            echo "Project still not linked to ${BIT_ORG}/${BIT_REPO} (got ${ORG}/${REPO})"
            exit 1
          fi

          LM=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            "https://policestationrepuk.org/api/lead-magnet" \
            -H "content-type: application/json" \
            -d '{"email":"ops-git-link@example.com"}')
          echo "POST /api/lead-magnet → ${LM}"
          if [ "$LM" != "404" ] && [ "$LM" != "405" ]; then
            echo "Lead-magnet endpoint unexpectedly alive (${LM})"
            exit 1
          fi
