# When CI — Next.js build fails on master, apply safe ESLint autofixes and push
# a follow-up commit so CI / Vercel can resume. Non-fixable failures email the owner.
name: CI autofix

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI — Next.js build']
    types: [completed]
    branches: [master, main]

concurrency:
  group: ci-autofix-master
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  autofix:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      LEGACY_REPS_PUBLIC: '1'
      CRON_SECRET: 'ci-smoke-placeholder-not-for-production'
    steps:
      - name: Resolve failed SHA
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "run_url=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout failed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}
          # Need full history / write token for push to master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Skip if this commit is already an autofix
        id: guard
        run: |
          MSG="$(git log -1 --pretty=%B)"
          if echo "$MSG" | grep -q '\[ci-autofix\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit already marked [ci-autofix] — refusing another autofix loop."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Apply ESLint autofix
        if: steps.guard.outputs.skip != 'true'
        id: lintfix
        run: |
          set +e
          npm run lint -- --fix 2>&1 | tee lint-autofix.log
          LINT_EXIT=${PIPESTATUS[0]}
          set -e
          if git diff --quiet; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
            echo "lint_exit=$LINT_EXIT" >> "$GITHUB_OUTPUT"
            echo "No file changes from eslint --fix (failure is not auto-fixable)."
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
            echo "lint_exit=$LINT_EXIT" >> "$GITHUB_OUTPUT"
            echo "ESLint produced file changes."
            git diff --stat
          fi

      - name: Verify typecheck + lint after autofix
        if: steps.guard.outputs.skip != 'true' && steps.lintfix.outputs.dirty == 'true'
        id: verify
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee tsc-verify.log
          TSC_EXIT=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee lint-verify.log
          LINT_EXIT=${PIPESTATUS[0]}
          set -e
          echo "tsc_exit=$TSC_EXIT" >> "$GITHUB_OUTPUT"
          echo "lint_exit=$LINT_EXIT" >> "$GITHUB_OUTPUT"
          if [ "$TSC_EXIT" -eq 0 ] && [ "$LINT_EXIT" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Commit and push autofix to master
        if: >
          steps.guard.outputs.skip != 'true' &&
          steps.lintfix.outputs.dirty == 'true' &&
          steps.verify.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          FAILED_SHA="${{ steps.meta.outputs.sha }}"
          RUN_URL="${{ steps.meta.outputs.run_url }}"
          git commit -m "$(cat <<EOF
          fix(ci): autofix after failed Next.js build [ci-autofix]

          Failed SHA: ${FAILED_SHA}
          Run: ${RUN_URL}
          EOF
          )"
          # Push to the default branch the failed run was on
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          git push origin "HEAD:refs/heads/${BRANCH}"

      - name: Notify owner when autofix cannot push
        if: >
          always() &&
          steps.guard.outputs.skip != 'true' &&
          (steps.lintfix.outputs.dirty != 'true' || steps.verify.outcome == 'failure' || steps.verify.outputs.ok == 'false')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.CI_AUTOFIX_NOTIFY_EMAIL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          FAILED_SHA: ${{ steps.meta.outputs.sha }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
          DIRTY: ${{ steps.lintfix.outputs.dirty }}
          VERIFY_OK: ${{ steps.verify.outputs.ok }}
        run: |
          TO="${NOTIFY_EMAIL:-${OWNER_EMAIL:-robertdavidcashman@gmail.com}}"
          REASON="ESLint produced no fixable changes (dirty=${DIRTY:-unknown}); verify_ok=${VERIFY_OK:-unknown}."
          echo "## Autofix could not push" >> "$GITHUB_STEP_SUMMARY"
          echo "$REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "Failed SHA: $FAILED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "RESEND_API_KEY secret not set — email skipped (summary only)."
            exit 0
          fi
          export TO REASON
          python3 - <<'PY' > /tmp/ci-autofix-mail.json
          import json, os
          reason = os.environ["REASON"]
          sha = os.environ["FAILED_SHA"]
          url = os.environ["RUN_URL"]
          to = os.environ["TO"]
          html = (
            "<p>CI autofix could not recover the failed Next.js build.</p>"
            f"<ul><li><strong>SHA:</strong> {sha}</li>"
            f"<li><strong>Reason:</strong> {reason}</li>"
            f'<li><a href="{url}">GitHub Actions run</a></li></ul>'
            "<p>Autofix only applies <code>eslint --fix</code>. "
            "TypeScript / Vitest / Playwright failures still need a normal code fix.</p>"
          )
          print(json.dumps({
            "from": "PoliceStationRepUK <noreply@policestationrepuk.org>",
            "to": [to],
            "subject": f"[CI autofix] Could not auto-recover {sha[:7]}",
            "html": html,
          }))
          PY
          curl -sS -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d @/tmp/ci-autofix-mail.json \
            -w "\nHTTP:%{http_code}\n" | tail -5
