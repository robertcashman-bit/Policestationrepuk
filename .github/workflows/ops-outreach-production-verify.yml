# Deploy this branch tip to Vercel production and run a bounded outreach verify.
# Triggers on push to cursor/outreach-* so cloud agents can verify without
# workflow_dispatch (integration tokens often lack dispatch scope).
#
# Bit's production source guard may re-promote bit master within ~30 minutes.
# Complete status → probe → force send inside that window.
name: Ops — outreach production verify

on:
  push:
    branches:
      - 'cursor/outreach-**'
    paths:
      - 'lib/firm-outreach/**'
      - 'lib/kv-atomic.ts'
      - 'app/api/cron/firm-outreach*/**'
      - 'packages/firm-outreach-core/**'
      - 'scripts/outreach*'
      - 'scripts/firm-outreach*'
      - 'scripts/firm-outreach-production-kick.mjs'
      - 'scripts/firm-outreach-kick-prepare-auth.mjs'
      - '.github/workflows/ops-outreach-production-verify.yml'
      - '.github/workflows/ops-production-outreach-hold.yml'
      - 'app/api/unsubscribe/**'
      - 'app/outreach/unsubscribe/**'
      - 'vercel.json'
  workflow_dispatch:
    inputs:
      confirm_live:
        description: 'Type SEND to allow live probe + bounded flush (otherwise status only)'
        required: true
        type: string
      limit:
        description: 'Max emails for flush'
        required: false
        default: '8'
        type: string

concurrency:
  group: outreach-production-verify
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: robert-cashmans-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Vercel secrets
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID required"
            exit 1
          fi

      - name: Install Vercel CLI (pinned)
        run: npm install -g vercel@41.4.0

      - name: Trigger or locate git production deployment
        id: deployment
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          REF="${GITHUB_REF_NAME}"
          REPO_ID="${{ github.repository_id }}"
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer ${VERCEL_TOKEN}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${SHA} ref=${REF} repoId=${REPO_ID}"

          find_url() {
            curl -sS "${API}/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=40" \
              -H "${AUTH}" \
              | jq -r --arg sha "$SHA" '.deployments[] | select(.meta.githubCommitSha == $sha) | .url' \
              | head -1
          }

          URL="$(find_url || true)"
          if [ -z "$URL" ]; then
            echo "No deployment for ${SHA}; triggering git production build"
            RESP=$(curl -sS -X POST "${API}/v13/deployments?teamId=${VERCEL_ORG_ID}" \
              -H "${AUTH}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"policestationrepuk-new\",\"project\":\"${VERCEL_PROJECT_ID}\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"repoId\":${REPO_ID},\"ref\":\"${REF}\",\"sha\":\"${SHA}\"}}")
            echo "$RESP" | jq '{id, url, readyState, error: .error}' || echo "$RESP"
            URL=$(echo "$RESP" | jq -r '.url // empty')
            if [ -z "$URL" ]; then
              echo "Failed to trigger deployment"
              echo "$RESP"
              exit 1
            fi
          fi
          echo "url=https://${URL}" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: https://${URL}"

      - name: Wait for READY and promote
        run: |
          set -euo pipefail
          DEPLOY_URL="${{ steps.deployment.outputs.url }}"
          HOST="${DEPLOY_URL#https://}"
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer ${VERCEL_TOKEN}"

          promote_production() {
            set +e
            OUT=$(vercel promote "$DEPLOY_URL" --yes --scope="$VERCEL_SCOPE" --timeout=15m --token="$VERCEL_TOKEN" 2>&1)
            RC=$?
            set -e
            echo "$OUT"
            if [ "$RC" -eq 0 ]; then return 0; fi
            if echo "$OUT" | grep -qiE 'already the current production deployment|is already production'; then
              echo "Already current production — success"
              return 0
            fi
            return "$RC"
          }

          for i in $(seq 1 60); do
            STATE=$(curl -sS "${API}/v13/deployments/${HOST}?teamId=${VERCEL_ORG_ID}" \
              -H "${AUTH}" | jq -r '.readyState // "UNKNOWN"')
            echo "[$i/60] deployment state=${STATE}"
            if [ "$STATE" = "READY" ]; then
              promote_production
              exit 0
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "Deployment failed state=${STATE}"
              exit 1
            fi
            sleep 20
          done
          echo "Deployment did not become READY within timeout (last state=${STATE:-UNKNOWN})"
          exit 1

      - name: Wait for production health SHA
        run: |
          set -euo pipefail
          WANT="${{ steps.deployment.outputs.sha }}"
          WANT_SHORT="${WANT:0:7}"
          for i in $(seq 1 40); do
            CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" "https://policestationrepuk.org/api/health" || echo "000")
            VER=$(jq -r '.version // empty' /tmp/health.json 2>/dev/null || true)
            echo "[$i/40] health HTTP ${CODE} version=${VER} want=${WANT_SHORT}"
            if [ "$CODE" = "200" ] && [ "$VER" = "$WANT_SHORT" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Production health did not match ${WANT_SHORT} in time"
          cat /tmp/health.json || true
          exit 1

      - name: Prepare kick auth (decrypt / provision)
        env:
          GH_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_BOOTSTRAP_SECRET: ${{ secrets.FIRM_OUTREACH_BOOTSTRAP_SECRET }}
          # Allow one controlled rotate when Vercel decrypt returns envelopes only.
          # Safe because this workflow is single-flight (concurrency cancel-in-progress).
          FIRM_OUTREACH_ALLOW_BOOTSTRAP_ROTATE: '1'
        run: |
          set -euo pipefail
          if [ -n "${GH_CRON_SECRET:-}" ]; then export CRON_SECRET="$GH_CRON_SECRET"; fi
          if [ -n "${GH_BOOTSTRAP_SECRET:-}" ]; then export FIRM_OUTREACH_BOOTSTRAP_SECRET="$GH_BOOTSTRAP_SECRET"; fi
          case "${CRON_SECRET:-}" in eyJ*) unset CRON_SECRET ;; esac
          case "${FIRM_OUTREACH_BOOTSTRAP_SECRET:-}" in eyJ*) unset FIRM_OUTREACH_BOOTSTRAP_SECRET ;; esac
          node scripts/firm-outreach-kick-prepare-auth.mjs

      - name: Status + probe + bounded force flush
        env:
          GH_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_BOOTSTRAP_SECRET: ${{ secrets.FIRM_OUTREACH_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          # Prefer GH secrets; ignore Vercel envelope ciphertext left in GITHUB_ENV.
          if [ -n "${GH_CRON_SECRET:-}" ]; then export CRON_SECRET="$GH_CRON_SECRET"; fi
          if [ -n "${GH_BOOTSTRAP_SECRET:-}" ]; then export FIRM_OUTREACH_BOOTSTRAP_SECRET="$GH_BOOTSTRAP_SECRET"; fi
          case "${CRON_SECRET:-}" in eyJ*) unset CRON_SECRET ;; esac
          case "${FIRM_OUTREACH_BOOTSTRAP_SECRET:-}" in eyJ*) unset FIRM_OUTREACH_BOOTSTRAP_SECRET ;; esac
          case "${RESEND_WEBHOOK_SECRET:-}" in eyJ*|whsec_*) ;; *) unset RESEND_WEBHOOK_SECRET ;; esac
          case "${RESEND_WEBHOOK_SECRET:-}" in eyJ*) unset RESEND_WEBHOOK_SECRET ;; esac
          export FIRM_OUTREACH_KICK_BASE_URL=https://policestationrepuk.org
          export FIRM_OUTREACH_KICK_REQUIRE_AUTH=1
          export FIRM_OUTREACH_KICK_COMMIT_SHA="${{ steps.deployment.outputs.sha }}"

          # Manual dispatch: require confirm_live=SEND for probe/flush; otherwise status only.
          # Push-triggered verify always runs the full live kick.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.confirm_live }}" != "SEND" ]; then
              export FIRM_OUTREACH_KICK_STATUS_ONLY=1
            else
              LIMIT="${{ github.event.inputs.limit }}"
              export FIRM_OUTREACH_KICK_FLUSH_LIMIT="${LIMIT:-8}"
            fi
          fi

          node scripts/firm-outreach-production-kick.mjs 2>&1 | tee /tmp/outreach-kick.log

          if [ "${FIRM_OUTREACH_KICK_STATUS_ONLY:-}" = "1" ]; then
            echo "Status-only dispatch — skipped live send evidence check"
            exit 0
          fi

          # Require evidence of Resend acceptance (probe and/or flush).
          if ! grep -E '"accepted":[1-9]|"messageId":"[^"]+"|jobsClaimed.:[1-9]' /tmp/outreach-kick.log; then
            echo "No accepted sends / messageIds / jobsClaimed in kick log"
            exit 1
          fi

      - name: Upload kick log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-production-verify-${{ github.sha }}
          path: |
            /tmp/outreach-kick.log
            /tmp/health.json
          if-no-files-found: ignore
