# Post-deploy live verification for dual-workspace outreach.
name: Ops — outreach live verify

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/ops-outreach-verify-live.yml'
      - 'scripts/ops-ensure-outreach-admin-email.mjs'
      - 'lib/firm-outreach/**'
      - 'app/api/cron/firm-outreach-*/**'
      - 'packages/firm-outreach-core/**'
      - 'vercel.json'
  workflow_run:
    workflows:
      - Deploy to Vercel (production)
    types:
      - completed
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VERIFY to run live outreach verification'
        required: true
        type: string

concurrency:
  group: outreach-live-verify
  cancel-in-progress: false

jobs:
  verify:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'VERIFY') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'master' ||
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BASE_URL: https://policestationrepuk.org
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel@41.4.0

      - name: Resolve auth + ensure OUTREACH_ADMIN_EMAIL
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIRM_OUTREACH_BOOTSTRAP_SECRET: ${{ secrets.FIRM_OUTREACH_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            vercel env pull .env.production --environment=production --yes --token="$VERCEL_TOKEN" >/dev/null
          fi

          # Prefer GH secrets; fill from pulled env only into a private file (never GITHUB_ENV).
          python3 - <<'PY'
          import os
          from pathlib import Path
          env = {}
          p = Path('.env.production')
          if p.exists():
              for line in p.read_text().splitlines():
                  s = line.strip()
                  if not s or s.startswith('#') or '=' not in s: continue
                  if s.startswith('export '): s = s[len('export '):]
                  k, v = s.split('=', 1)
                  v = v.strip()
                  if len(v) >= 2 and v[0] == v[-1] and v[0] in ("'", '"'):
                      v = v[1:-1]
                  env[k] = v
          cron = os.environ.get('CRON_SECRET') or env.get('CRON_SECRET') or ''
          boot = os.environ.get('FIRM_OUTREACH_BOOTSTRAP_SECRET') or env.get('FIRM_OUTREACH_BOOTSTRAP_SECRET') or ''
          digest = (
              env.get('OUTREACH_ADMIN_EMAIL')
              or env.get('FIRM_OUTREACH_DIGEST_EMAIL')
              or env.get('BUFFER_SCHEDULER_NOTIFY_EMAIL')
              or env.get('OWNER_EMAIL')
              or ''
          )
          Path('.outreach-auth').write_text(f'{cron}\n{boot}\n')
          Path('.outreach-digest').write_text(digest)
          print(f'auth cron_len={len(cron)} bootstrap_len={len(boot)} digest_set={bool(digest)}')
          if not cron and not boot:
              raise SystemExit('Missing CRON_SECRET / FIRM_OUTREACH_BOOTSTRAP_SECRET')
          PY

          DIGEST=$(cat .outreach-digest)
          if [ -n "$DIGEST" ]; then
            OUTREACH_ADMIN_EMAIL="$DIGEST" FIRM_OUTREACH_DIGEST_EMAIL="$DIGEST" \
              node scripts/ops-ensure-outreach-admin-email.mjs || true
          fi

      - name: Wait for production on bit tip (autoheal present)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TIP=$(gh api "repos/${{ github.repository }}/commits/master" --jq .sha)
          TIP_SHORT="${TIP:0:7}"
          echo "Want bit tip ${TIP_SHORT} with autoheal route"
          for i in $(seq 1 60); do
            BODY=$(curl -fsS "$BASE_URL/api/health" || true)
            VER=$(echo "$BODY" | jq -r '.version // empty' 2>/dev/null || true)
            AH=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/api/cron/firm-outreach-autoheal" || echo 000)
            echo "[$i/60] health=${BODY} autoheal=${AH}"
            if [ "$VER" = "$TIP_SHORT" ] && [ "$AH" != "404" ]; then
              # Soak once more — droid races flip within ~1–2 minutes historically.
              sleep 45
              BODY2=$(curl -fsS "$BASE_URL/api/health" || true)
              VER2=$(echo "$BODY2" | jq -r '.version // empty' 2>/dev/null || true)
              AH2=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/api/cron/firm-outreach-autoheal" || echo 000)
              echo "soak health=${BODY2} autoheal=${AH2}"
              if [ "$VER2" = "$TIP_SHORT" ] && [ "$AH2" != "404" ]; then
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Production never stabilized on bit tip ${TIP_SHORT}"
          exit 1

      - name: Status + autoheal + bounded send + report
        run: |
          set -euo pipefail
          CRON_SECRET=$(sed -n '1p' .outreach-auth)
          BOOT=$(sed -n '2p' .outreach-auth)
          if [ -n "$CRON_SECRET" ]; then
            AUTH=(-H "Authorization: Bearer ${CRON_SECRET}")
          else
            AUTH=(-H "x-firm-outreach-bootstrap-secret: ${BOOT}")
          fi

          call() {
            local name="$1"; shift
            local out="$1"; shift
            echo "== $name =="
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' "${AUTH[@]}" "$@" || true)
            echo "HTTP $code"
            if [ "$code" != "200" ]; then
              head -c 500 "$out" || true; echo
              return 1
            fi
            python3 -c 'import json,sys; json.load(open(sys.argv[1])); print("json_ok", sys.argv[1])' "$out"
          }

          # Vercel kills /firm-outreach-send at 300s. Overlap JSON (200 +
          # reason=overlap) means another tick already holds the send lock —
          # retry until that lock TTL (~270s) expires.
          call_worker() {
            local out="$1"; shift
            local i reason
            for i in 1 2 3 4 5 6; do
              if ! call worker "$out" "$@"; then
                echo "worker HTTP fail attempt ${i}; retrying"
                sleep 25
                continue
              fi
              reason=$(python3 -c "import json;d=json.load(open('$out'));print(d.get('reason') or '')" 2>/dev/null || true)
              if [ "$reason" = "overlap" ]; then
                echo "worker overlap attempt ${i}; waiting for send lock"
                sleep 40
                continue
              fi
              return 0
            done
            echo "worker still overlapping after retries; keeping last JSON"
            return 0
          }

          call status status.json "$BASE_URL/api/cron/firm-outreach-status"
          python3 - <<'PY'
          import json
          d=json.load(open('status.json'))
          c=d.get('config') or {}
          q=d.get('queue') or {}
          print({
            'dryRun': c.get('dryRun'),
            'sendAllowed': c.get('sendAllowed'),
            'sendHealthy': c.get('sendHealthy'),
            'sendBlockers': c.get('sendBlockers'),
            'digestEmail': c.get('digestEmail'),
            'requireApproval': c.get('requireApproval'),
            'resendQuotaRemaining': c.get('resendQuotaRemaining'),
            'readyToSend': q.get('readyToSend'),
            'sendableReady': q.get('sendableReady'),
            'sentToday': q.get('sentToday'),
            'campaigns': [
              {'id': x.get('campaignId'), 'canSend': x.get('canSend'), 'domain': x.get('domain')}
              for x in (c.get('campaignSendHealth') or [])
            ],
          })
          # If digest known from status and admin ensure earlier missed sensitive pull, set now.
          open('.status-digest','w').write(c.get('digestEmail') or '')
          PY

          if [ -s .status-digest ]; then
            OUTREACH_ADMIN_EMAIL="$(cat .status-digest)" FIRM_OUTREACH_DIGEST_EMAIL="$(cat .status-digest)" \
              node scripts/ops-ensure-outreach-admin-email.mjs || true
          fi

          call autoheal_nosend autoheal1.json "$BASE_URL/api/cron/firm-outreach-autoheal?noSend=1"
          call_worker send.json "$BASE_URL/api/cron/firm-outreach-send?limit=5"
          # Autoheal may skip on overlap right after worker — tolerate non-200 only if overlap JSON.
          set +e
          call autoheal autoheal2.json "$BASE_URL/api/cron/firm-outreach-autoheal"
          AH=$?
          set -e
          if [ "$AH" -ne 0 ]; then
            echo "autoheal call failed (may be transient); continuing"
          fi
          call report report.json "$BASE_URL/api/cron/firm-outreach-daily-report?force=1"

          python3 - <<'PY'
          import json
          send=json.load(open('send.json'))
          report=json.load(open('report.json'))
          status=json.load(open('status.json'))
          ah1=json.load(open('autoheal1.json'))
          print('SUMMARY', {
            'health_config_ok': bool((status.get('config') or {}).get('sendHealthy')),
            'worker_mode': send.get('mode'),
            'accepted': send.get('accepted'),
            'claimed': send.get('claimed'),
            'jobsCreated': send.get('jobsCreated'),
            'byCampaign': {
              cid: {k: (row or {}).get(k) for k in ('accepted','jobsCreated','jobsClaimed','queued','sent','skipped','partial','elapsedMs','skipReasons')}
              for cid, row in (send.get('byCampaign') or {}).items()
            },
            'eligibility': (status.get('queue') or {}).get('eligibility'),
            'autoheal_faults': ah1.get('faultCount'),
            'capacity': ah1.get('capacity'),
            'report_ok': report.get('ok'),
            'report_provider_message_id': report.get('providerMessageId'),
            'report_already_sent': report.get('alreadySent'),
            'report_date': report.get('reportDate'),
            'acceptedTotal': report.get('acceptedTotal'),
          })
          assert send.get('mode') == 'outreach-worker', send.get('mode')
          assert report.get('ok') is True
          cfg=status.get('config') or {}
          assert cfg.get('dryRun') is False
          assert cfg.get('sendAllowed') is True
          assert cfg.get('sendHealthy') is True
          elig=((status.get('queue') or {}).get('eligibility') or {}).get('whatsapp_invite_v1') or {}
          wa=(send.get('byCampaign') or {}).get('whatsapp_invite_v1') or {}
          last=elig.get('lastRun') or {}
          pool=(elig.get('readyEligible') or 0)+(elig.get('followUpEligible') or 0)
          tick_ok=((wa.get('accepted') or 0)+(wa.get('jobsCreated') or 0)) > 0
          last_ok=(last.get('sent') or 0) > 0
          overlap=send.get('reason')=='overlap' or send.get('skipped') is True
          if pool >= 10:
              assert tick_ok or last_ok, {'repuk': wa, 'overlap': overlap, 'eligibility': elig}
          PY

      - name: Upload ops artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: outreach-live-verify
          path: |
            status.json
            autoheal1.json
            send.json
            autoheal2.json
            report.json
          if-no-files-found: ignore
