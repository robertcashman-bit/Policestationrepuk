# Keep production on this outreach branch tip when bit's source guard reverts
# to robertcashman-bit master (which lacks lock release / force=1).
#
# Runs every 10 minutes. Promote-only when live /api/health version drifts.
# Does NOT send campaign email — use Ops — outreach production verify for that.
name: Ops — production outreach hold

on:
  schedule:
    # Offset from bit guard at :07/:37 so we reclaim within ~10 minutes.
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
    inputs:
      force_promote:
        description: 'Force promote even if health already matches tip'
        required: false
        default: 'false'
        type: string

concurrency:
  group: production-outreach-hold
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: robert-cashmans-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Pin the branch that owns the verified outreach fix.
      HOLD_REF: cursor/outreach-e2e-reliability-f4ff
    steps:
      - name: Require Vercel secrets
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID required"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HOLD_REF }}
          fetch-depth: 1

      - name: Install Vercel CLI (pinned)
        run: npm install -g vercel@41.4.0

      - name: Detect drift and promote tip
        id: hold
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT="${SHA:0:7}"
          FORCE="${{ github.event.inputs.force_promote || 'false' }}"
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer ${VERCEL_TOKEN}"
          REPO_ID="${{ github.repository_id }}"

          LIVE=$(curl -sS "https://policestationrepuk.org/api/health" || echo '{}')
          VER=$(echo "$LIVE" | jq -r '.version // empty')
          echo "Live version=${VER} want=${SHORT} force=${FORCE}"

          if [ "$FORCE" != "true" ] && [ "$VER" = "$SHORT" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Production already on outreach hold tip ${SHORT}"
            exit 0
          fi

          echo "drift=true" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          find_url() {
            curl -sS "${API}/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=40" \
              -H "${AUTH}" \
              | jq -r --arg sha "$SHA" '.deployments[] | select(.meta.githubCommitSha == $sha) | .url' \
              | head -1
          }

          URL="$(find_url || true)"
          if [ -z "$URL" ]; then
            echo "No deployment for ${SHA}; triggering git production build"
            RESP=$(curl -sS -X POST "${API}/v13/deployments?teamId=${VERCEL_ORG_ID}" \
              -H "${AUTH}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"policestationrepuk-new\",\"project\":\"${VERCEL_PROJECT_ID}\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"repoId\":${REPO_ID},\"ref\":\"${HOLD_REF}\",\"sha\":\"${SHA}\"}}")
            echo "$RESP" | jq '{id, url, readyState, error: .error}' || echo "$RESP"
            URL=$(echo "$RESP" | jq -r '.url // empty')
            if [ -z "$URL" ]; then
              echo "Failed to trigger deployment"
              exit 1
            fi
          fi

          DEPLOY_URL="https://${URL#https://}"
          echo "Promoting ${DEPLOY_URL}"

          for i in $(seq 1 60); do
            STATE=$(curl -sS "${API}/v13/deployments/${URL}?teamId=${VERCEL_ORG_ID}" \
              -H "${AUTH}" | jq -r '.readyState // "UNKNOWN"')
            echo "[$i/60] deployment state=${STATE}"
            if [ "$STATE" = "READY" ]; then
              set +e
              OUT=$(vercel promote "$DEPLOY_URL" --yes --scope="$VERCEL_SCOPE" --timeout=15m --token="$VERCEL_TOKEN" 2>&1)
              RC=$?
              set -e
              echo "$OUT"
              if [ "$RC" -ne 0 ] && ! echo "$OUT" | grep -qiE 'already the current production'; then
                exit "$RC"
              fi
              break
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "Deployment failed state=${STATE}"
              exit 1
            fi
            sleep 15
          done

          for i in $(seq 1 40); do
            CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" "https://policestationrepuk.org/api/health" || echo "000")
            VER2=$(jq -r '.version // empty' /tmp/health.json 2>/dev/null || true)
            echo "[$i/40] health HTTP ${CODE} version=${VER2} want=${SHORT}"
            if [ "$CODE" = "200" ] && [ "$VER2" = "$SHORT" ]; then
              echo "Hold restored production to ${SHORT}"
              exit 0
            fi
            sleep 10
          done
          echo "Failed to restore production to ${SHORT}"
          cat /tmp/health.json || true
          exit 1
